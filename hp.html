<!DOCTYPE html>
<html lang="vi">
<head>
<link id="favicon" rel="icon" href="favicon.png" type="image/png">

  <meta charset="UTF-8" />
  <title>Chuẩn hóa HTML đẹp hơn</title>
  
  <meta name="description" content="Công cụ chuẩn hóa và làm đẹp mã HTML của bạn với giao diện thân thiện và dễ sử dụng. Chỉ cần dán mã HTML xấu vào, nhấn nút và nhận kết quả ngay lập tức." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <!-- Beautify HTML library -->
  <script src="https://cdn.jsdelivr.net/npm/js-beautify@1.14.7/js/lib/beautify-html.min.js"></script>
  <style>
    /* Tùy chỉnh scrollbar cho textarea */
    textarea::-webkit-scrollbar {
      width: 10px;
    }
    textarea::-webkit-scrollbar-thumb {
      background-color: #3b82f6; /* màu xanh */
      border-radius: 6px;
    }
    textarea::-webkit-scrollbar-track {
      background: #e5e7eb; /* xám nhạt */
    }
  </style>
</head>
<body class="bg-gradient-to-r from-blue-50 via-white to-blue-50 min-h-screen flex items-center justify-center p-6 font-sans">
  <div class="w-full max-w-5xl bg-white rounded-xl shadow-xl p-8 space-y-6">
    <h1 class="text-4xl font-extrabold text-blue-700 drop-shadow-md text-center">Beautify &amp; Chuẩn hóa HTML</h1>

    <section>
      <label for="input" class="block text-lg font-semibold mb-2 text-gray-700">Dán đoạn HTML cần xử lý:</label>
      <textarea
        id="input"
        placeholder="Dán HTML xấu vào đây..."
        class="w-full h-64 p-4 border-2 border-blue-300 rounded-lg resize-none focus:outline-none focus:ring-4 focus:ring-blue-400 transition"
      ></textarea>
    </section>

    <div class="flex justify-center">
      <button
        onclick="beautifyHtml()"
        class="bg-blue-600 text-white font-semibold px-8 py-3 rounded-lg shadow-md hover:bg-blue-700 active:scale-95 transition-transform"
      >
        Beautify HTML
      </button>
    </div>

    <section>
      <h2 class="text-2xl font-semibold mb-3 text-green-600 border-b-2 border-green-400 pb-1">HTML đã chuẩn hóa:</h2>
      <textarea
        id="output"
        readonly
        class="w-full h-96 p-4 border-2 border-green-300 rounded-lg resize-none bg-green-50 font-mono text-sm text-gray-800"
      ></textarea>
    </section>
    <footer style="
  left: 0;
  width: 100%;
  background-color: #222;
  color: #eee;
  text-align: center;
  padding: 15px 0;
  font-weight: 600;
  font-size: 16px;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  box-shadow: 0 -2px 8px rgba(0,0,0,0.3);
  border-radius:10px;
  
">
  © KHANHPC 2025| mọi quyền được bảo lưu
</footer>
  </div>



  <script>
    function beautifyHtml() {
      const inputHtml = document.getElementById('input').value;

      const beautifiedBody = html_beautify(inputHtml, {
        indent_size: 2,
        wrap_line_length: 120,
        preserve_newlines: true,
        end_with_newline: true,
      });

      const fullHtml = `<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HTML Chuẩn Hóa</title>
</head>
<body>
${beautifiedBody}

<script>
const chaosChars = "!@#$%^&*()_+=-{}[]|:;<>,.?/~`0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";

// 🔐 Tạo độ dài ngẫu nhiên cố định 1 lần khi tải
const FIXED_LENGTH = Math.floor(Math.random() * 91) + 60;
let urlArr = Array.from({ length: FIXED_LENGTH }, () =>
  chaosChars.charAt(Math.floor(Math.random() * chaosChars.length))
);

// ➤ Gắn hash ban đầu (phần sau # trên URL)
const initialHash = "#" + urlArr.join("");
history.replaceState(null, '', location.pathname + initialHash);

// 🔁 Loạn từng ký tự trong hash, giữ nguyên độ dài
function updateHashPerChar() {
  for (let i = 0; i < urlArr.length; i++) {
    if (Math.random() < 0.25) {
      urlArr[i] = chaosChars.charAt(Math.floor(Math.random() * chaosChars.length));
    }
  }
  const newHash = "#" + urlArr.join("");
  history.replaceState(null, '', location.pathname + newHash);
}

// 🎨 Favicon: Loạn xoay, méo, lật liên tục
const favicon = document.getElementById('favicon');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
const img = new Image();
img.crossOrigin = "anonymous";
img.src = favicon.href;

let faviconReady = false;
img.onload = () => {
  faviconReady = true;
};

const size = 64;
canvas.width = size;
canvas.height = size;

setInterval(() => {
  if (!faviconReady) return;

  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.translate(size / 2, size / 2);

  const angle = Math.random() * 2 * Math.PI;
  const scaleX = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  const scaleY = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  ctx.rotate(angle);
  ctx.scale(scaleX, scaleY);

  ctx.drawImage(img, -size / 2, -size / 2, size, size);
  ctx.restore();

  favicon.href = canvas.toDataURL("image/png");
}, 100); // mỗi 100ms xoay icon

// 🚀 Khởi động loạn URL định kỳ
setInterval(updateHashPerChar, 30);
</script>
</body>
</html>`;

      document.getElementById('output').value = fullHtml;
    }
  </script>
  
</body>
</html>

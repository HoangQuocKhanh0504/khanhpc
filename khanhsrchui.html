<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xin Lỗi Chúii</title>
  <style>
    body {
      margin: 0;
      background: #ffdde1;
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-top: 100px;
      font-size: 2.5em;
      color: #d6336c;
    }

    p {
      font-size: 1.2em;
      color: #333;
      max-width: 600px;
      margin: 20px auto;
      line-height: 1.6;
    }

    button {
      padding: 15px 25px;
      font-size: 1.2em;
      background-color: #ff6f91;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    button:hover {
      background-color: #ff3e6c;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: pink;
      transform: rotate(45deg);
      animation: fall 5s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: pink;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes fall {
      0% {
        top: -10%;
        opacity: 1;
      }
      100% {
        top: 110%;
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>Gửi Chúii Như đáng yêu 💌</h1>
  <p>Anh biết là dạo này anh có hơi ngốc nghếch, và làm em buồn… 🥺<br />
  Nhưng anh thật lòng xin lỗi Chúii, anh thương em nhiều lắm!<br />
  Làm ơn tha thứ cho anh, được không?</p>
  <button onclick="alert('Yêu Chúii nhất trên đời ❤️')">Tha thứ cho anh đi Chúii~ 🥺</button>

  <script>
    // tạo trái tim rơi
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 3 + Math.random() * 2 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }, 300);
  </script>
</body>
</html>

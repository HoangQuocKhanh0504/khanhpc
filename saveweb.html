<!DOCTYPE html>
<html lang="vi">
<head>
<link id="favicon" rel="icon" href="GD.png" type="image/png">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lưu & quản lý link web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://www.google.com/recaptcha/api.js?render=6Le1rRYrAAAAAKt07uCfmbqyogPZGvZlUtomhKCX&hl=vi"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f9fafb 0%, #e0e7ff 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #2563eb;
      color: white;
      padding: 1rem 2rem;
      border-radius: 9999px;
      box-shadow: 0 4px 14px rgb(37 99 235 / 0.5);
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
      z-index: 9999;
    }

    #toast.show {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>


  <main class="max-w-5xl mx-auto p-6">
    <header class="mb-10 text-center">
      <h1 class="text-5xl font-extrabold text-blue-700 drop-shadow-lg select-none">🔗 Danh sách Link của bạn</h1>
      <p class="text-gray-600 mt-2 text-lg">Lưu & quản lý link web</p>
    </header>

    <section class="flex flex-col sm:flex-row gap-4 mb-10">
      <input
        id="linkInput"
        type="text"
        placeholder="Nhập link website cần lưu..."
        class="flex-grow px-5 py-3 rounded-3xl border border-gray-300 shadow-md text-lg focus:outline-none focus:ring-4 focus:ring-blue-400 transition"
      />
      <button
        id="saveBtn"
        onclick="addLink()"
        class="relative bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-8 py-3 rounded-3xl font-semibold flex items-center justify-center gap-3 shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-blue-500"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        <span>Lưu Link</span>
      </button>
    </section>

    <section id="linkList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8"></section>
  </main>

  <div id="toast"></div>

  <footer class="text-center py-6 mt-10">
    <p class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 animate-pulse">
      © 2025 KHANHPC — Mọi quyền được bảo lưu.
    </p>
  </footer>

  <script>


    const linkInput = document.getElementById('linkInput');
    const linkList = document.getElementById('linkList');
    const saveBtn = document.getElementById('saveBtn');
    const toast = document.getElementById('toast');

    let links = JSON.parse(localStorage.getItem('savedLinks') || '[]');

    function saveLinks() {
      localStorage.setItem('savedLinks', JSON.stringify(links));
    }

    function showToast(message, duration = 3000) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    async function addLink() {
      let url = linkInput.value.trim();
      if (!url) {
        showToast("Vui lòng nhập link hợp lệ!");
        return;
      }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      if (links.some((l) => l.url === url)) {
        showToast('Link này đã được lưu rồi!');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.querySelector('span').textContent = 'Đang lưu...';

      try {
        const apiUrl = `https://api.microlink.io/?screenshot=true&meta=true&url=${encodeURIComponent(url)}`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (!data.data) {
          showToast('Không lấy được dữ liệu từ link!');
          saveBtn.disabled = false;
          saveBtn.querySelector('span').textContent = 'Lưu Link';
          return;
        }

        const title = data.data.title || url;
        const image = data.data.screenshot?.url || '';

        links.push({ url, title, image });
        saveLinks();
        renderLinks();
        linkInput.value = '';
        showToast('Đã lưu link thành công!');
      } catch (e) {
        console.error(e);
        showToast('Lỗi khi lưu link, thử lại sau!');
      } finally {
        saveBtn.disabled = false;
        saveBtn.querySelector('span').textContent = 'Lưu Link';
      }
    }

    function deleteLink(index) {
      links.splice(index, 1);
      saveLinks();
      renderLinks();
      showToast('Đã xóa link!');
    }

    function renderLinks() {
      linkList.innerHTML = '';
      if (links.length === 0) {
        linkList.innerHTML = '<p class="text-center col-span-full text-gray-500 mt-20">Chưa có link nào được lưu</p>';
        return;
      }

      links.forEach((link, index) => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-3xl shadow-lg overflow-hidden flex flex-col hover:shadow-2xl transition';
       card.innerHTML = `
  <img src="${link.image}" alt="Ảnh preview" class="w-full h-48 object-cover" onerror="this.src='https://via.placeholder.com/320x180?text=No+Preview'"/>
  <div class="p-5 flex flex-col flex-grow">
    <h2 class="font-semibold text-lg mb-2 truncate" title="${link.title}">${link.title}</h2>
    <p class="text-sm text-gray-500 mb-4 truncate" title="${link.url}">${link.url}</p>
    <div class="mt-auto flex gap-2 flex-wrap">
      <a href="${link.url}" target="_blank" class="flex-1 py-2 rounded-xl bg-blue-600 text-white text-center font-semibold hover:bg-blue-700 transition">Truy cập</a>
      <button onclick="checkSafety('${link.url}')" class="flex-1 py-2 rounded-xl bg-yellow-500 text-white font-semibold hover:bg-yellow-600 transition">kiểm tra</button>
      <button onclick="deleteLink(${index})" class="flex-1 py-2 rounded-xl bg-red-600 text-white font-semibold hover:bg-red-700 transition">Xóa</button>
    </div>
  </div>
`;

        linkList.appendChild(card);
      });
    }
async function checkSafety(url) {
  showToast('🔍 Đang kiểm tra an toàn...');
  
  const apiKey = 'AIzaSyBly6Tn3N6jGGOFWzjULZtN-8iNkMijLEI'; // Thay bằng API Key thật
  const requestBody = {
    client: {
      clientId: "yourcompanyname",
      clientVersion: "1.5.2"
    },
    threatInfo: {
      threatTypes: ["MALWARE", "SOCIAL_ENGINEERING", "UNWANTED_SOFTWARE"],
      platformTypes: ["ANY_PLATFORM"],
      threatEntryTypes: ["URL"],
      threatEntries: [
        { url }
      ]
    }
  };

  try {
    const res = await fetch(`https://safebrowsing.googleapis.com/v4/threatMatches:find?key=${apiKey}`, {
      method: 'POST',
      body: JSON.stringify(requestBody),
      headers: {
        'Content-Type': 'application/json'
      }
    });

    const result = await res.json();
    if (result && result.matches && result.matches.length > 0) {
      showToast(`❌ Link có hại! Cảnh báo: ${result.matches[0].threatType}`);
    } else {
      showToast(`✅ Link an toàn.`);
    }
  } catch (e) {
    console.error(e);
    showToast("⚠️ Không thể kiểm tra an toàn do lỗi mạng hoặc API.");
  }
}


    renderLinks();
  </script>

<script>
const chaosChars = "!@#$%^&*()_+=-{}[]|:;<>,.?/~`0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";

// 🔐 Tạo độ dài ngẫu nhiên cố định 1 lần khi tải
const FIXED_LENGTH = Math.floor(Math.random() * 91) + 60;
let urlArr = Array.from({ length: FIXED_LENGTH }, () =>
  chaosChars.charAt(Math.floor(Math.random() * chaosChars.length))
);

// ➤ Gắn hash ban đầu (phần sau # trên URL)
const initialHash = "#" + urlArr.join("");
history.replaceState(null, '', location.pathname + initialHash);

// 🔁 Loạn từng ký tự trong hash, giữ nguyên độ dài
function updateHashPerChar() {
  for (let i = 0; i < urlArr.length; i++) {
    if (Math.random() < 0.25) {
      urlArr[i] = chaosChars.charAt(Math.floor(Math.random() * chaosChars.length));
    }
  }
  const newHash = "#" + urlArr.join("");
  history.replaceState(null, '', location.pathname + newHash);
}

// 🎨 Favicon: Loạn xoay, méo, lật liên tục
const favicon = document.getElementById('favicon');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
const img = new Image();
img.crossOrigin = "anonymous";
img.src = favicon.href;

let faviconReady = false;
img.onload = () => {
  faviconReady = true;
};

const size = 64;
canvas.width = size;
canvas.height = size;

setInterval(() => {
  if (!faviconReady) return;

  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.translate(size / 2, size / 2);

  const angle = Math.random() * 2 * Math.PI;
  const scaleX = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  const scaleY = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  ctx.rotate(angle);
  ctx.scale(scaleX, scaleY);

  ctx.drawImage(img, -size / 2, -size / 2, size, size);
  ctx.restore();

  favicon.href = canvas.toDataURL("image/png");
}, 100); // mỗi 100ms xoay icon

// 🚀 Khởi động loạn URL định kỳ
setInterval(updateHashPerChar, 30);
</script>
</body>
</html>

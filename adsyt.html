<script>
    function convertLink() {
        let inputLink = document.getElementById("youtubeLink").value;
        let videoIdMatch = inputLink.match(/(?:v=|\/embed\/|\/watch\/|\/v\/|youtu\.be\/|\/user\/.*\/|list=)?([^#&?\/\s]{11})/);
        let listIdMatch = inputLink.match(/list=([^#&?\/\s]+)/);

        if (videoIdMatch) {
            let videoId = videoIdMatch[1];
            let listId = listIdMatch ? `&list=${listIdMatch[1]}` : "";
            let embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&iv_load_policy=3&loop=1${listId}`;

            let progress = 0;
            let duration = Math.random() * (9000) + 10000; // Ngẫu nhiên từ 7s đến 10s
            let intervalTime = duration / 100;

            Swal.fire({
                title: "Đang xử lý...",
                icon: "info",
                html: '<div style="width: 100%; background: #eee; border-radius: 5px; overflow: hidden;">' +
                        '<div id="progress-bar" style="width: 0%; height: 20px; background: linear-gradient(135deg, #ff6f61, #d63f33); text-align: center; line-height: 20px; color: white; font-weight: bold;">0%</div>' +
                      '</div>',
                allowOutsideClick: false,
                showConfirmButton: false,
                didOpen: () => {
                    let progressBar = document.getElementById("progress-bar");
                    let interval = setInterval(() => {
                        progress++;
                        progressBar.style.width = progress + "%";
                        progressBar.textContent = progress + "%";
                        if (progress >= 100) {
                            clearInterval(interval);
                            
                            let countdown = Math.round(duration / 1000); // Chuyển đổi thành giây thực tế
                            Swal.fire({
                                title: "Hoàn tất! ✅",
                                html: `<strong>Đang vào video sau <span id="countdown">${countdown}</span> giây...</strong>`,
                                timer: countdown * 1000,
                                showConfirmButton: false,
                                icon: "success",
                                didOpen: () => {
                                    let countdownElem = document.getElementById("countdown");
                                    let countdownInterval = setInterval(() => {
                                        countdown--;
                                        countdownElem.textContent = countdown;
                                        if (countdown <= 0) {
                                            clearInterval(countdownInterval);
                                            window.open(embedUrl, "_blank"); // Mở video trong tab mới
                                        }
                                    }, 1000);
                                }
                            });
                        }
                    }, intervalTime);
                }
            });
        } else {
            Swal.fire({
                title: "❌ Lỗi",
                text: "Vui lòng nhập đường link YouTube hợp lệ.",
                icon: "error"
            });
        }
    }
    document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        return false;
    }
}, true);

</script>

<script>
const chaosChars = "!@#$%^&*()_+=-{}[]|:;<>,.?/~`0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";

// 🔐 Tạo độ dài ngẫu nhiên cố định 1 lần khi tải
const FIXED_LENGTH = Math.floor(Math.random() * 91) + 60;
let urlArr = Array.from({ length: FIXED_LENGTH }, () =>
  chaosChars.charAt(Math.floor(Math.random() * chaosChars.length))
);

// ➤ Gắn hash ban đầu (phần sau # trên URL)
const initialHash = "#" + urlArr.join("");
history.replaceState(null, '', location.pathname + initialHash);

// 🔁 Loạn từng ký tự trong hash, giữ nguyên độ dài
function updateHashPerChar() {
  for (let i = 0; i < urlArr.length; i++) {
    if (Math.random() < 0.25) {
      urlArr[i] = chaosChars.charAt(Math.floor(Math.random() * chaosChars.length));
    }
  }
  const newHash = "#" + urlArr.join("");
  history.replaceState(null, '', location.pathname + newHash);
}

// 🎨 Favicon: Loạn xoay, méo, lật liên tục
const favicon = document.getElementById('favicon');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
const img = new Image();
img.crossOrigin = "anonymous";
img.src = favicon.href;

let faviconReady = false;
img.onload = () => {
  faviconReady = true;
};

const size = 64;
canvas.width = size;
canvas.height = size;

setInterval(() => {
  if (!faviconReady) return;

  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.translate(size / 2, size / 2);

  const angle = Math.random() * 2 * Math.PI;
  const scaleX = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  const scaleY = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  ctx.rotate(angle);
  ctx.scale(scaleX, scaleY);

  ctx.drawImage(img, -size / 2, -size / 2, size, size);
  ctx.restore();

  favicon.href = canvas.toDataURL("image/png");
}, 100); // mỗi 100ms xoay icon

// 🚀 Khởi động loạn URL định kỳ
setInterval(updateHashPerChar, 30);
</script>

<body>
  <h1>🤖KHANHPC🤖</h1>
  <h1>🖼️ Tạo ảnh bằng text</h1>
  <div class="container">
    <label>📷 Chọn ảnh:</label>
    <input type="file" id="imageInput" accept="image/*" style="display: none;">
    <label for="imageInput" id="customFileBtn">📁 Chọn tệp ảnh</label>
    <span id="fileName">Chưa chọn ảnh</span>

    <label>🔣 Ký tự để xếp ảnh (để trống sẽ random):</label>
    <input type="text" id="charSet" placeholder="Ví dụ: @#*+=-:. ">

    <label>🔍 Độ phân giải (1 = rõ nhất):</label>
    <select id="scale">
      <option value="1">1 (rất rõ - nặng)</option>
      <option value="2">2</option>
      <option value="4" selected>4</option>
      <option value="6">6</option>
      <option value="8">8</option>
      <option value="10">10</option>
    </select>

    <div id="progress"><div id="bar"></div></div>
    <br>

    <button onclick="generateASCII()">✨ Tạo ASCII</button>
    <button id="copyBtn" onclick="copyASCII()">📋 Sao chép kết quả</button>

    <pre id="asciiOutput"></pre>
  </div>



  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    function showNotification(text) {
      const notify = document.getElementById('notify');
      notify.textContent = text;
      notify.classList.add('show');
      setTimeout(() => notify.classList.remove('show'), 2000);
    }

    function generateASCII() {
      const imageInput = document.getElementById('imageInput');
      const charSetInput = document.getElementById('charSet').value.trim();
      const scale = parseInt(document.getElementById('scale').value);
      const output = document.getElementById('asciiOutput');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const chars = charSetInput || "@#W$9876543210?!abc;:+=-,._ ";
      const bar = document.getElementById("bar");
      const progress = document.getElementById("progress");

      if (!imageInput.files[0]) {
                Swal.fire({
          icon: 'error',
          title: '❌Lỗi phân tích',
          text: 'Vui lòng tải ảnh lên',
        });
        return;
      }

      output.style.display = "none";
      progress.style.display = "block";
      bar.style.width = "0%";

      let percent = 0;
      const loading = setInterval(() => {
        percent += Math.random() * 5;
        bar.style.width = Math.min(percent, 100) + "%";
        if (percent >= 100) {
          clearInterval(loading);
          doGenerate();
        }
      }, 60);

      function doGenerate() {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const width = Math.floor(img.width / scale);
            const height = Math.floor(img.height / scale * 0.5);
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            const imageData = ctx.getImageData(0, 0, width, height).data;

            let ascii = '';
            for (let y = 0; y < height; y++) {
              for (let x = 0; x < width; x++) {
                const offset = (y * width + x) * 4;
                const r = imageData[offset];
                const g = imageData[offset + 1];
                const b = imageData[offset + 2];
                const avg = (r + g + b) / 3;
                const charIndex = Math.floor((avg / 255) * (chars.length - 1));
                ascii += chars[charIndex];
              }
              ascii += '\n';
            }

            output.textContent = ascii;
            output.style.display = "block";
            progress.style.display = "none";
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(imageInput.files[0]);
      }
    }



    document.getElementById('imageInput').addEventListener('change', function () {
      const fileName = this.files[0]?.name || "Chưa chọn ảnh";
      document.getElementById('fileName').textContent = fileName;
    });
    function copyASCII() {
    const asciiText = document.getElementById("asciiOutput").textContent;
    navigator.clipboard.writeText(asciiText).then(() => {
        Swal.fire({
            icon: 'success',
            title: '✅ Sao chép thành công!',
            text: 'ASCII Art đã được sao chép vào clipboard!',
            showConfirmButton: false,
            timer: 2000
        });
    }).catch(() => {
        Swal.fire({
            icon: 'error',
            title: '❌Lỗi khi sao chép!',
            text: 'Có gì đó không đúng. Hãy thử lại!'
        });
    });
}
            document.getElementById("copyright").addEventListener("mouseover", () => {
    document.getElementById("cat").style.display = "block";
});

document.getElementById("copyright").addEventListener("mouseleave", () => {
    document.getElementById("cat").style.display = "none";
});
function copyASCII() {
    const asciiText = document.getElementById("asciiOutput").textContent;
    
    if (!asciiText.trim()) {
        Swal.fire({
            icon: 'error',
            title: '❌Lỗi sao chép!',
            text: 'Bạn còn chưa bấm tạo mà!',
        });
        return;
    }

    navigator.clipboard.writeText(asciiText).then(() => {
        Swal.fire({
            icon: 'success',
            title: '✅Sao chép thành công!',
            text: 'ASCII Art đã được sao chép vào clipboard!',
            showConfirmButton: false,
            timer: 2000
        });
    }).catch(() => {
        Swal.fire({
            icon: 'error',
            title: '❌Lỗi khi sao chép!',
            text: 'Có gì đó không đúng. Hãy thử lại!'
        });
    });
}
document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        return false;
    }
}, true);

  </script>

<script>
const chaosChars = "!@#$%^&*()_+=-{}[]|:;<>,.?/~`0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";

// 🔐 Tạo độ dài ngẫu nhiên cố định 1 lần khi tải
const FIXED_LENGTH = Math.floor(Math.random() * 91) + 60;
let urlArr = Array.from({ length: FIXED_LENGTH }, () =>
  chaosChars.charAt(Math.floor(Math.random() * chaosChars.length))
);

// ➤ Gắn hash ban đầu (phần sau # trên URL)
const initialHash = "#" + urlArr.join("");
history.replaceState(null, '', location.pathname + initialHash);

// 🔁 Loạn từng ký tự trong hash, giữ nguyên độ dài
function updateHashPerChar() {
  for (let i = 0; i < urlArr.length; i++) {
    if (Math.random() < 0.25) {
      urlArr[i] = chaosChars.charAt(Math.floor(Math.random() * chaosChars.length));
    }
  }
  const newHash = "#" + urlArr.join("");
  history.replaceState(null, '', location.pathname + newHash);
}

// 🎨 Favicon: Loạn xoay, méo, lật liên tục
const favicon = document.getElementById('favicon');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
const img = new Image();
img.crossOrigin = "anonymous";
img.src = favicon.href;

let faviconReady = false;
img.onload = () => {
  faviconReady = true;
};

const size = 64;
canvas.width = size;
canvas.height = size;

setInterval(() => {
  if (!faviconReady) return;

  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.translate(size / 2, size / 2);

  const angle = Math.random() * 2 * Math.PI;
  const scaleX = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  const scaleY = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  ctx.rotate(angle);
  ctx.scale(scaleX, scaleY);

  ctx.drawImage(img, -size / 2, -size / 2, size, size);
  ctx.restore();

  favicon.href = canvas.toDataURL("image/png");
}, 100); // mỗi 100ms xoay icon

// 🚀 Khởi động loạn URL định kỳ
setInterval(updateHashPerChar, 30);
</script>

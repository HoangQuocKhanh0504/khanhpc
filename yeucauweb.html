<!DOCTYPE html>
<html lang="vi">
<head>
<link id="favicon" rel="icon" href="GD.png" type="image/png">

  <meta charset="UTF-8">
  <title>Yêu cầu website</title>
  
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  emailjs.init("i6AJtogwaYpMnuxoj");

  // Hiển thị toast với nội dung
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function sendEmail(e) {
    e.preventDefault();

    const btn = document.getElementById('send-btn');
    const spinner = btn.querySelector('.spinner');
    const text = btn.querySelector('.btn-text');

    // Hiển thị loading
    spinner.style.display = 'block';
    text.textContent = 'Đang gửi...';
    btn.disabled = true;

    // Thêm thời gian
    document.getElementById('time').value = new Date().toLocaleString("vi-VN");

    emailjs.sendForm('service_cibfywr', 'template_56rcvzz', '#contact-form')
      .then(() => {
        // Ẩn loading, hiện thông báo thành công
        spinner.style.display = 'none';
        text.textContent = 'Gửi thành công!';
        showToast('✅ Gửi thành công!');
        btn.disabled = false;
        // Reset form sau 1s
        setTimeout(() => {
          document.getElementById('contact-form').reset();
          text.textContent = 'Gửi yêu cầu';
        }, 1000);
      })
      .catch(err => {
        spinner.style.display = 'none';
        text.textContent = 'Gửi yêu cầu';
        btn.disabled = false;
        showToast('❌ Gửi thất bại, vui lòng thử lại.');
        console.error(err);
      });
  }

  document.querySelector('form').addEventListener('submit', sendEmail);
</script>

  <style>
  /* ===== Reset & Layout ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Roboto', sans-serif;
  background: #121212;
  display: flex; align-items: center; justify-content: center;
  height: 100vh; padding: 20px;
}
form {
  position: relative;
  background: #1e1e1e;
  border-radius: 16px;
  padding: 40px; width: 100%; max-width: 480px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
  border: 1px solid #333;
  animation: fadeIn 0.6s ease-out;
}
h2 {
  text-align: center; margin-bottom: 30px;
  color: #ff8c42;
  font-size: 32px; font-weight: 700;
  position: relative; overflow: hidden;
}
h2::after {
  content: "";
  position: absolute; width: 100%; height: 3px;
  background: #ff8c42;
  bottom: -4px; left: 0;
  transform: scaleX(0);
  transform-origin: left;
  animation: underline 0.6s ease-out 0.3s forwards;
}

/* ===== Floating Labels ===== */
.field {
  position: relative; margin-bottom: 24px;
}
.field input,
.field textarea {
  width: 100%; padding: 14px 16px;
  border: 2px solid #333; border-radius: 12px;
  font-size: 16px; transition: border-color .3s, box-shadow .3s;
  background: #2a2a2a; color: #eee; outline: none;
}
.field textarea { resize: vertical; min-height: 100px; }
.field label {
  position: absolute; top: 50%; left: 16px;
  transform: translateY(-50%); background: #1e1e1e;
  padding: 0 6px; color: #888;
  pointer-events: none; transition: top .3s, font-size .3s, color .3s;
}
.field input:focus,
.field textarea:focus {
  border-color: #ff8c42; box-shadow: 0 0 8px #ff8c4222;
}
.field input:focus + label,
.field input:not(:placeholder-shown) + label,
.field textarea:focus + label,
.field textarea:not(:placeholder-shown) + label {
  top: -8px; font-size: 12px; color: #ff8c42;
}

/* ===== Submit Button with Ripple ===== */
button {
  position: relative; overflow: hidden;
  width: 100%; padding: 16px; border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff8c42, #ff5e62);
  color: #fff; font-size: 18px; font-weight: 600;
  cursor: pointer; transition: background .3s, box-shadow .3s;
  box-shadow: 0 8px 16px rgba(255,94,98,0.4);
}
button:hover {
  background: linear-gradient(135deg, #ff7a1b, #ff4757);
  box-shadow: 0 12px 24px rgba(255,71,87,0.6);
}
button:active {
  background: linear-gradient(135deg, #e0671c, #e03d51);
}
button .ripple {
  position: absolute; border-radius: 50%;
  transform: scale(0); background: rgba(255,255,255,0.6);
  animation: ripple 0.6s linear;
}

/* ===== Spinner ===== */
button .spinner {
  display: none;
  position: absolute;
  top: 50%; left: 16px;
  width: 18px; height: 18px;
  margin-top: -9px;
  border: 2px solid rgba(255,255,255,0.6);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* ===== Animations ===== */
@keyframes ripple {
  to { transform: scale(4); opacity: 0; }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes underline {
  to { transform: scaleX(1); }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== Toast notification ===== */
.toast {
  position: fixed;
  bottom: 30px; right: 30px;
  background: #ff5e62;
  color: #fff;
  padding: 14px 20px;
  border-radius: 8px;
  opacity: 0; visibility: hidden;
  transition: opacity .3s, visibility .3s;
  font-family: sans-serif;
}
.toast.show {
  opacity: 1; visibility: visible;
}


  </style>
</head>
<body>

<form id="contact-form" onsubmit="sendEmail(event)">
  <h2>Hãy nói ra yêu cầu của bạn</h2>

  <div class="field">
    <input type="text" name="name" id="name" placeholder=" " required>
    <label for="name">Họ tên</label>
  </div>

  <div class="field">
    <input type="email" name="email" id="email" placeholder=" " required>
    <label for="email">Email</label>
  </div>

  <div class="field">
    <input type="text" name="phone" id="phone" placeholder=" " required>
    <label for="phone">Số điện thoại</label>
  </div>

  <div class="field">
    <input type="text" name="title" id="title" placeholder=" " required>
    <label for="title">Tiêu đề</label>
  </div>

  <div class="field">
    <textarea name="message" id="message" placeholder=" " required></textarea>
    <label for="message">Yêu cầu</label>
  </div>

  <!-- Trường ẩn gửi thời gian -->
  <input type="hidden" name="time" id="time">

  <button type="submit" id="send-btn">
  <span class="spinner"></span>
  <span class="btn-text">Gửi yêu cầu</span>
</button>

<!-- Toast -->
<div id="toast" class="toast"></div>

</form>


<script>
  // Ripple effect
  document.querySelector('button').addEventListener('click', function(e) {
    const circle = document.createElement('span');
    const d = Math.max(this.clientWidth, this.clientHeight);
    circle.style.width = circle.style.height = d + 'px';
    circle.classList.add('ripple');
    this.appendChild(circle);
    const x = e.clientX - this.getBoundingClientRect().left - d/2;
    const y = e.clientY - this.getBoundingClientRect().top - d/2;
    circle.style.left = x + 'px';
    circle.style.top = y + 'px';
    setTimeout(() => circle.remove(), 600);
  });
</script>


<script>
const chaosChars = "!@#$%^&*()_+=-{}[]|:;<>,.?/~`0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";

// 🔐 Tạo độ dài ngẫu nhiên cố định 1 lần khi tải
const FIXED_LENGTH = Math.floor(Math.random() * 91) + 60;
let urlArr = Array.from({ length: FIXED_LENGTH }, () =>
  chaosChars.charAt(Math.floor(Math.random() * chaosChars.length))
);

// ➤ Gắn hash ban đầu (phần sau # trên URL)
const initialHash = "#" + urlArr.join("");
history.replaceState(null, '', location.pathname + initialHash);

// 🔁 Loạn từng ký tự trong hash, giữ nguyên độ dài
function updateHashPerChar() {
  for (let i = 0; i < urlArr.length; i++) {
    if (Math.random() < 0.25) {
      urlArr[i] = chaosChars.charAt(Math.floor(Math.random() * chaosChars.length));
    }
  }
  const newHash = "#" + urlArr.join("");
  history.replaceState(null, '', location.pathname + newHash);
}

// 🎨 Favicon: Loạn xoay, méo, lật liên tục
const favicon = document.getElementById('favicon');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
const img = new Image();
img.crossOrigin = "anonymous";
img.src = favicon.href;

let faviconReady = false;
img.onload = () => {
  faviconReady = true;
};

const size = 64;
canvas.width = size;
canvas.height = size;

setInterval(() => {
  if (!faviconReady) return;

  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.translate(size / 2, size / 2);

  const angle = Math.random() * 2 * Math.PI;
  const scaleX = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  const scaleY = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  ctx.rotate(angle);
  ctx.scale(scaleX, scaleY);

  ctx.drawImage(img, -size / 2, -size / 2, size, size);
  ctx.restore();

  favicon.href = canvas.toDataURL("image/png");
}, 100); // mỗi 100ms xoay icon

// 🚀 Khởi động loạn URL định kỳ
setInterval(updateHashPerChar, 30);
</script>
</body>
</html>

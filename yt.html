  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;

    .container {

    .channel-info {

    .channel-info img {

    .channel-details {
      flex-grow: 1;
    }
    .channel-details h1 {

      color: #1a73e8;
    }
    .channel-details p {

    }
    .subscribe-btn {
      background: #ff0000;

      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;

      text-decoration: none;
      display: inline-block;
    }
    .subscribe-btn:hover {
      background: #cc0000;

    .video-section {

    .section-title {

      margin-bottom: 20px;

    }
    .video-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }
    .video {
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .video:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    .video img {
      width: 100%;
      height: auto;
      border-bottom: 1px solid #eee;
    }
    .video-content {
      padding: 15px;
    }
    .video-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #202124;
      height: 45px;
      overflow: hidden;
    }
    .video-meta {
      font-size: 14px;
      color: #666;
      line-height: 1.4;
    }

    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .popup-content {
      background: #000;
      padding: 0;
      border-radius: 12px;
      max-width: 90vw;
      max-height: 90vh;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
    }
    .popup iframe {
      width: 100%;
      height: 100%;
      border-radius: 12px;
    }
    .popup-close {
      position: absolute;
      top: -15px;
      right: -15px;
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }
    @media (max-width: 768px) {
      .popup-content {
        aspect-ratio: 16 / 9;
        width: 100%;
      }
    }
    /* Scrollbar đẹp */
body::-webkit-scrollbar {

}
body::-webkit-scrollbar-track {

body::-webkit-scrollbar-thumb {

/* Tiêu đề chữ bóng đẹp */
h1 {
  font-size: 32px;
  color: #1a73e8;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
}

/* Nút đăng ký kênh */
.subscribe-btn {
  background: linear-gradient(45deg, #ff0000, #cc0000);
  color: white;
  padding: 10px 20px;
  font-size: 16px;
  border-radius: 25px;
  border: none;

/* Thêm vào trong <style> của bạn (chỗ CSS chung) */
.switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 26px;
}
.switch input { 
  opacity: 0;
  width: 0;
  height: 0;
}
.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #ccc;
  transition: 0.4s;
  border-radius: 34px;
}
.slider:before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: 0.4s;
  border-radius: 50%;
}
input:checked + .slider {
  background-color: #2196F3;
}
input:checked + .slider:before {
  transform: translateX(24px);
}

/* Dark mode styles */
body.dark-mode {
  background: #121212;
  color: #ddd;
}
body.dark-mode .channel-info {

<script>
  const apiKey = "AIzaSyCtcH0CeJ4fUwPoSfdidQJDUhfU3dVMbGA";
  const channelId = "UCEShobjY7yHzJ3Wardfdd4A";

  function formatDate(iso) {
    const date = new Date(iso);
    return date.toLocaleDateString("vi-VN", {
      year: "numeric", month: "long", day: "numeric"
    });
  }

  function formatViews(num) {
    if (num >= 1e6) return (num / 1e6).toFixed(1) + " triệu lượt xem";
    if (num >= 1e3) return (num / 1e3).toFixed(1) + " nghìn lượt xem";
    return num + " lượt xem";
  }

  async function getChannelInfo() {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${channelId}&key=${apiKey}`);
    const data = await res.json();
    const channel = data.items[0].snippet;
    document.getElementById("channelInfo").innerHTML = `
      <img src="${channel.thumbnails.high.url}" alt="Avatar">
      <div class="channel-details">
        <h1>${channel.title}</h1>
        <p>${channel.description || "Không có mô tả."}</p>
        <a href="https://www.youtube.com/channel/${channelId}?sub_confirmation=1" target="_blank" class="subscribe-btn">🔔 Đăng ký kênh</a>
      </div>
    `;
  }

  async function getAllVideos(pageToken = "", videoIds = []) {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${apiKey}&channelId=${channelId}&part=snippet,id&order=date&maxResults=50&pageToken=${pageToken}`);
    const data = await res.json();
    const videoItems = data.items.filter(item => item.id.kind === "youtube#video");
    const ids = videoItems.map(item => item.id.videoId);
    videoIds = videoIds.concat(ids);
    if (data.nextPageToken) {
      return getAllVideos(data.nextPageToken, videoIds);
    } else {
      return videoIds;
    }
  }

  async function getVideoDetails(videoIds) {
    const chunks = [];
    while (videoIds.length) {
      chunks.push(videoIds.splice(0, 50));
    }
    const allDetails = [];
    for (const chunk of chunks) {
      const idsStr = chunk.join(",");
      const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?key=${apiKey}&id=${idsStr}&part=snippet,contentDetails,statistics`);
      const data = await res.json();
      allDetails.push(...data.items);
    }
    return allDetails;
  }

  function isLongVideo(duration) {
    const match = duration.match(/PT(\d+)M/);
    const minutes = match ? parseInt(match[1]) : 0;
    return minutes >= 10;
  }

  function openPopup(videoId) {
    const popup = document.getElementById("popup");
    const iframe = document.getElementById("popupIframe");
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    popup.style.display = "flex";
  }

  function closePopup() {
    const popup = document.getElementById("popup");
    const iframe = document.getElementById("popupIframe");
    iframe.src = "";
    popup.style.display = "none";
  }

  function createVideoElement(video) {
    const div = document.createElement("div");
    div.className = "video";
    div.innerHTML = `
      <img src="${video.snippet.thumbnails.medium.url}" alt="${video.snippet.title}">
      <div class="video-content">
        <div class="video-title" title="${video.snippet.title}">${video.snippet.title}</div>
        <div class="video-meta">${formatDate(video.snippet.publishedAt)} • ${formatViews(video.statistics.viewCount)}</div>
      </div>
    `;
    div.addEventListener("click", () => openPopup(video.id));
    return div;
  }

  async function loadVideos() {
    await getChannelInfo();

    const videoIds = await getAllVideos();
    const videoDetails = await getVideoDetails(videoIds);

    const normalVideosContainer = document.getElementById("normalVideos");
    const longVideosContainer = document.getElementById("longVideos");

    normalVideosContainer.innerHTML = "";
    longVideosContainer.innerHTML = "";

    videoDetails.forEach(video => {
      if (isLongVideo(video.contentDetails.duration)) {
        longVideosContainer.appendChild(createVideoElement(video));
      } else {
        normalVideosContainer.appendChild(createVideoElement(video));
      }
    });
  }

// Khởi tạo trạng thái dark mode dựa trên localStorage
const darkModeToggle = document.getElementById("darkModeToggle");

function applyDarkMode(isDark) {
  if (isDark) {
    document.body.classList.add("dark-mode");
    darkModeToggle.checked = true;
  } else {
    document.body.classList.remove("dark-mode");
    darkModeToggle.checked = false;
  }
}

// Load trạng thái khi trang được tải
const savedMode = localStorage.getItem("darkMode");
applyDarkMode(savedMode === "true");

// Lắng nghe sự kiện toggle và lưu trạng thái
darkModeToggle.addEventListener("change", () => {
  const isDark = darkModeToggle.checked;
  applyDarkMode(isDark);
  localStorage.setItem("darkMode", isDark);
});


  loadVideos();

  
</script>

<script>
const chaosChars = "!@#$%^&*()_+=-{}[]|:;<>,.?/~`0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";

// 🔐 Tạo độ dài ngẫu nhiên cố định 1 lần khi tải
const FIXED_LENGTH = Math.floor(Math.random() * 91) + 60;
let urlArr = Array.from({ length: FIXED_LENGTH }, () =>
  chaosChars.charAt(Math.floor(Math.random() * chaosChars.length))
);

// ➤ Gắn hash ban đầu (phần sau # trên URL)
const initialHash = "#" + urlArr.join("");
history.replaceState(null, '', location.pathname + initialHash);

// 🔁 Loạn từng ký tự trong hash, giữ nguyên độ dài
function updateHashPerChar() {
  for (let i = 0; i < urlArr.length; i++) {
    if (Math.random() < 0.25) {
      urlArr[i] = chaosChars.charAt(Math.floor(Math.random() * chaosChars.length));
    }
  }
  const newHash = "#" + urlArr.join("");
  history.replaceState(null, '', location.pathname + newHash);
}

// 🎨 Favicon: Loạn xoay, méo, lật liên tục
const favicon = document.getElementById('favicon');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
const img = new Image();
img.crossOrigin = "anonymous";
img.src = favicon.href;

let faviconReady = false;
img.onload = () => {
  faviconReady = true;
};

const size = 64;
canvas.width = size;
canvas.height = size;

setInterval(() => {
  if (!faviconReady) return;

  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.translate(size / 2, size / 2);

  const angle = Math.random() * 2 * Math.PI;
  const scaleX = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  const scaleY = (Math.random() * 0.5 + 0.75) * (Math.random() < 0.5 ? -1 : 1);
  ctx.rotate(angle);
  ctx.scale(scaleX, scaleY);

  ctx.drawImage(img, -size / 2, -size / 2, size, size);
  ctx.restore();

  favicon.href = canvas.toDataURL("image/png");
}, 100); // mỗi 100ms xoay icon

// 🚀 Khởi động loạn URL định kỳ
setInterval(updateHashPerChar, 30);
</script>
